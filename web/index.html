<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harborline — Simple Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Harborline</a>
    <div class="top-actions">
      <div id="react-cart-root"></div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-media" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="brand-mark">Harborline</p>
      <h1>Everyday goods, ready to order.</h1>
      <p>Pick a product, review the details, and check out with a simple cart.</p>
      <a class="btn btn-primary" href="products.html">View Products</a>
    </div>
  </section>

  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="js/CartWidget.jsx"></script>
</body>
</html>
